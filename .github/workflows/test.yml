name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Zero dependencies: no install step. Syntax-check the scripts, then run the suite.
      - run: node --check ingest.mjs && node --check detail.mjs && node --check make-sample.mjs && node --check lib/explore.js
      - run: node --test
